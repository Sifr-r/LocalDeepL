version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Frontend dependencies live in frontend/ (audit P1-7).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dockerfile + compose.yaml base images (audit P1-7).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
