name: Tests

# Fast-tier validation on every PR + push to main.
#
# Scope: runs `pytest -m "not slow"`. Skips the `slow`
# marker because those tests load Surya from HF Hub (~500MB download on
# first run); not worth the CI minutes for routine validation. Skips
# `live_llm` markers too -- those need a real LLM endpoint we don't have
# in CI.
#
# Matrix: Python 3.11 (the floor in pyproject.toml) and 3.13
# to catch version-specific regressions without quadrupling runtime.

on:
  push:
    branches: [main]
  pull_request:
  # F4.4 audit fix: weekly Playwright e2e (Sun 04:00 UTC) against the
  # in-process ``MockLLMServer`` so the smoke no longer requires a
  # self-hosted runner. Picked 04:00 UTC Sunday to clear the
  # 02:00 UTC Semgrep (``security.yml``) and 03:00 UTC Surya
  # (``nightly.yml``) windows.
  schedule:
    - cron: "0 4 * * 0"
  # Manual dispatch path: maintainer can supply a real LLM endpoint
  # via the inputs below. Without an ``llm_api_base`` input the
  # ``e2e`` job falls back to the in-process ``MockLLMServer``
  # started by the ``Start mock LLM server (scheduled runs)`` step
  # (which uses the ``if: env.LLM_API_BASE == '' || …`` guard).
  workflow_dispatch:
    inputs:
      llm_api_base:
        description: "LLM API base URL (e.g. http://localhost:1234/v1). Leave blank to use the in-process mock server."
        required: false
        type: string
        default: ""
      llm_model:
        description: "Model id (e.g. allenai/olmocr-2-7b). Defaults to 'mock-vlm' when llm_api_base is blank."
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the fast tier only reads the repo and uploads
# workflow artifacts (no extra scopes needed for either).
permissions:
  contents: read

jobs:
  fast:
    name: pytest (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # F4.17 audit fix (documented): the matrix intentionally
      # covers Python 3.11 (the floor in ``pyproject.toml``) on
      # both ubuntu + windows, plus 3.13 on ubuntu. The nightly
      # workflow adds 3.12 to the slow tier so the production
      # window (3.12+) gets a Surya-path regression run nightly;
      # the fast tier stays at 3.11 + 3.13 so the matrix doesn't
      # quadruple in size. The drift is documented here so a
      # future "why doesn't nightly match test.yml?" question has
      # the answer in-tree.
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
        include:
          - os: windows-latest
            python: "3.11"
    steps:
      # Action refs are SHA-pinned (audit P3-12); bump with
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and test/build frontend
        run: |
          cd frontend
          npm ci
          npm run check
          npm test
          npm run build

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Sync deps (CLI + web extras)
        # F4.20 audit fix (documented): the fast tier intentionally
        # does NOT install ``--extra async-translation`` (Celery +
        # Redis + LangGraph). The async translation path is
        # exercised in the nightly workflow where a real Redis
        # container is available. The fast tier stays under
        # ~2 minutes by skipping the async extras; the nightly
        # tier catches async regressions. ``uv sync`` resolves
        # the core + web extra, which is what the fast
        # ``pytest -m "not slow"`` collection needs.
        run: uv sync --extra web

      - name: Run Ruff check
        run: uv run ruff check src tests --no-fix

      - name: Run Ruff format check
        run: uv run ruff format src tests --check

      - name: Run Mypy type check
        run: uv run mypy src tests

      - name: Run fast tests
        run: uv run pytest -m "not slow and not slow_dataset" --cov=src/omniscribe --cov-fail-under=85 --cov-report=term-missing --cov-report=xml -v

      - name: Run pip-audit vulnerability check
        # Keep in sync with `make audit` (Makefile): PYSEC-2026-311 /
        # CVE-2026-45829 (chromadb server RCE) is risk-accepted — no
        # patched release exists yet and neither vector is reachable in
        # OmniScribe (embedded PersistentClient only, explicit
        # embedding_function= everywhere). See the Makefile comment; drop
        # the flag once chromadb ships a fixed release (>1.5.9).
        run: uv run pip-audit --ignore-vuln PYSEC-2026-311

      - name: Generate CycloneDX SBOM
        # F5-09 audit fix: only generate the SBOM when this run is
        # part of the release path. The previous unconditional
        # generation produced N (Python version) × M (OS) artifacts
        # per fast-tier run, none of which the ``release.yml``
        # workflow consumed. Gating on ``github.ref == 'refs/heads/main'``
        # and ``github.event_name != 'pull_request'`` (the matrix
        # also runs on PRs) keeps the single canonical SBOM that
        # release artifacts attach to. PRs still build the project
        # and run the test suite; they just skip the SBOM.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Upload CycloneDX SBOM artifact
        # Same gate as the generation step. The artifact name is
        # matrix-free because the gated run is a single OS (ubuntu)
        # + single Python (3.13) when the trigger is push to main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx.json
          path: sbom.json
          if-no-files-found: ignore

  # Audit M2: build the production Dockerfile and scan the resulting image
  # for HIGH/CRITICAL CVEs. Findings surface in the GitHub Security tab
  # via the SARIF upload (the "trivy" category), so the team can triage
  # container CVEs alongside the Dependabot and Semgrep alerts that
  # `security.yml` already produces. No paid scanner: this is Trivy OSS
  # against the public GHSA / NVD feeds, no API key required.
  #
  # Independent of `fast` -- Docker build + image scan is slow and would
  # otherwise lengthen the pytest matrix. Runs in parallel; both jobs
  # must pass for the workflow to be green.
  container-scan:
    name: container scan (trivy OSS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ``security-events: write`` is required so the SARIF upload
      # actually lands in the Security tab; without it the upload
      # silently no-ops. Same pattern as the Semgrep job in
      # `security.yml`.
      security-events: write
    steps:
      # Action refs are SHA-pinned (audit P3-12 / P2-15); bump with
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`. The
      # docker/* and aquasecurity/trivy-action pins below are part of
      # that same contract; the trailing `# v3` / `# v6` / `# 0.28.0`
      # comments are the human-readable tag the SHA resolves to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (load into local daemon for scanning)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # `load: true` puts the built image into the runner's local
          # Docker daemon so the follow-up `trivy image` step can scan
          # it. `push: false` keeps the image off any registry -- this
          # is a CI scan, not a publish.
          load: true
          push: false
          tags: omniscribe:scan
          # GHA build cache (audit P2-4: cache layers across runs to
          # keep build + scan under a couple of minutes once warm).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: omniscribe:scan
          format: sarif
          output: trivy-results.sarif
          # Fail the build on any unfixed HIGH/CRITICAL -- a vuln with
          # no upstream patch can still be acceptable if the vector is
          # unreachable, but that's a per-CVE decision best made in a
          # Security-tab triage, not silently ignored in CI.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # GITHUB_TOKEN is auto-injected; using it raises the GHSA
          # rate limit so the public-feed path doesn't 429 on PR
          # bursts. Not a "secret" in the audit's sense (audit M2
          # forbids paid scanner keys, not the runner's own token).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # Audit L9: hardens the Playwright E2E (`test_ui.py`) and gives it a
  # first-class CI seat. The script was previously run by hand against a
  # local `start_app.vbs` boot; this job makes that same path reproducible
  # on a `ubuntu-latest` runner with a headless Chromium and a built
  # frontend bundle.
  #
  # Parallel (not `needs: fast`) -- the e2e is an integration smoke
  # against a running server + live LLM, not a regression gate; chaining
  # it behind the pytest matrix would double PR latency for no signal
  # and would block unrelated work on a flaky OCR roundtrip. Mirrors
  # the `container-scan` decision above.
  #
  # F4.4 audit fix: the e2e now also runs on a weekly schedule with
  # a ``MockLLMServer`` (``scripts/mock_llm_server.py``) so the
  # Playwright run no longer requires a real LM Studio / Ollama /
  # OpenAI-compatible endpoint. The mock server speaks just enough
  # of the OpenAI chat-completion protocol to drive the OCR pipeline
  # through to completion; the e2e asserts UI behaviour, not OCR
  # quality. Manual ``workflow_dispatch`` runs still work and
  # continue to require the maintainer to provide a real
  # ``LLM_API_BASE`` env var (the mock server is not started in that
  # path -- see the ``if [ -z "$LLM_API_BASE" ]`` branch below).
  e2e:
    # F5-10 audit fix: rename the job to "e2e (manual dispatch)"
    # so the Actions UI clearly signals that the Playwright run is
    # maintainer-triggered, not a regression gate. The
    # ``workflow_dispatch || schedule`` guard below remains the
    # source of truth — this rename is purely a UI affordance.
    name: e2e (manual dispatch, playwright + chromium)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Action refs are SHA-pinned (audit P3-12); bump with
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          # 3.12 matches the nightly matrix -- the slow tier is the
        # closest existing precedent for a long-running e2e.
        python-version: "3.12"

      - name: Sync deps (web extra)
        run: uv sync --extra web

      - name: Build frontend
        # vite writes to `src/omniscribe/static/` per the
        # `frontend/vite.config.ts` `outDir` setting; that is the
        # directory the FastAPI app mounts as the SPA bundle.
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Playwright + Chromium
        # `uv run --with playwright` keeps the dep out of pyproject
        # until a dev actually wires it into a local env; matches
        # the audit's suggested invocation. `--with-deps` resolves
        # the system libraries Chromium needs on Ubuntu (libnss3,
        # libxkbcommon, fonts, ...).
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Propagate dispatch inputs to env
        # F4.4 audit fix: ``workflow_dispatch.inputs.*`` is not
        # automatically exposed as an env var; copy the two that
        # the server needs (``LLM_API_BASE`` and ``LLM_MODEL``) so
        # the next steps can use the same ``$LLM_API_BASE``
        # expression whether the run came in via dispatch or
        # schedule. Empty values are skipped so the
        # ``env.LLM_API_BASE == ''`` guard in the mock-server
        # start step still works for unscheduled dispatch.
        if: github.event_name == 'workflow_dispatch'
        env:
          LLM_API_BASE_INPUT: ${{ inputs.llm_api_base }}
          LLM_MODEL_INPUT: ${{ inputs.llm_model }}
        run: |
          if [ -n "$LLM_API_BASE_INPUT" ]; then
            echo "LLM_API_BASE=$LLM_API_BASE_INPUT" >> "$GITHUB_ENV"
          fi
          if [ -n "$LLM_MODEL_INPUT" ]; then
            echo "LLM_MODEL=$LLM_MODEL_INPUT" >> "$GITHUB_ENV"
          fi

      - name: Start mock LLM server (scheduled runs)
        # F4.4 audit fix: weekly scheduled runs do not have access
        # to a real LLM endpoint, so this job stands up
        # ``scripts/mock_llm_server.py`` on port 8001 and points
        # ``omniscribe-server`` at it via ``LLM_API_BASE``. Manual
        # ``workflow_dispatch`` runs that set ``LLM_API_BASE`` in
        # the GitHub UI skip this step and use the real endpoint.
        if: env.LLM_API_BASE == '' || github.event_name == 'schedule'
        run: |
          nohup uv run python scripts/mock_llm_server.py --port 8001 > mock_llm.log 2>&1 &
          echo $! > mock_llm.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/healthz > /dev/null; then
              echo "Mock LLM server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Mock LLM server failed to become healthy within 30s"
          cat mock_llm.log
          exit 1

      - name: Set LLM_API_BASE for scheduled runs
        # When the maintainer did not supply ``LLM_API_BASE`` via
        # the dispatch UI (or this is a scheduled run), point the
        # server at the local mock. ``LLM_MODEL=mock-vlm`` matches
        # the ``--model`` default in ``scripts/mock_llm_server.py``.
        if: env.LLM_API_BASE == '' || github.event_name == 'schedule'
        run: |
          echo "LLM_API_BASE=http://localhost:8001/v1" >> "$GITHUB_ENV"
          echo "LLM_MODEL=mock-vlm" >> "$GITHUB_ENV"
          echo "LLM_API_KEY=mock-key" >> "$GITHUB_ENV"

      - name: Start omniscribe-server
        # Background server for the Playwright run. `nohup` +
        # `&` detaches the process from the step so the next
        # command can poll the readiness probe; the redirect
        # captures the startup log so a connection-refused
        # error is debuggable from the Actions run page.
        # ``LLM_API_BASE`` is set by the previous step on
        # scheduled runs; on manual dispatches that override it,
        # the value comes through unchanged.
        run: |
          echo "Using LLM_API_BASE=${LLM_API_BASE:-<unset>}"
          nohup uv run omniscribe-server --port 8000 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server failed to become healthy within 60s"
          cat server.log
          exit 1

      - name: Run Playwright smoke (test_ui.py)
        # SCREENSHOT_PATH points at the workspace; the next step
        # uploads it as an artifact regardless of pass/fail so
        # the maintainer can eyeball the UI state after a manual
        # dispatch. The 180s budget in `test_ui.py` is the
        # OCR-completion timeout and intentionally exceeds the
        # default step timeout.
        run: uv run --with playwright python test_ui.py

      - name: Upload screenshot + server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshot
          path: |
            screenshot.png
            server.log
            mock_llm.log
          if-no-files-found: ignore

      - name: Stop servers
        if: always()
        # Clean up the detached servers even when the test
        # step above failed; the workflow runner otherwise
        # SIGKILLs the whole process tree on job exit, but
        # stopping here keeps the Actions log tidy and
        # avoids a misleading "Connection refused" trailing
        # line in the next manual run on the same runner.
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
            rm -f server.pid
          fi
          if [ -f mock_llm.pid ]; then
            kill "$(cat mock_llm.pid)" 2>/dev/null || true
            rm -f mock_llm.pid
          fi

