name: Nightly slow

# Slow-tier validation. Loads Surya (~500MB first run from HF Hub) and
# runs `pytest -m slow` end-to-end. Catches:
#   * Regressions in the hybrid / grounded OCR pipelines that the fast
#     tier can't see (it skips `slow` to keep PR-cycle latency down).
#   * PyMuPDF rendering path regressions that only show on large PDFs.
#
# Cadence: nightly cron at 03:00 UTC plus manual dispatch. Caches the
# HF Hub snapshot across runs so we don't re-download on every night.
#
# Live-LLM tests (`-m live_llm`) are still skipped - they need a real
# OpenAI-compatible endpoint we don't run in CI.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

# Least privilege: nightly jobs only read the repo and cache/upload
# their own artifacts.
permissions:
  contents: read

jobs:
  slow:
    name: pytest (py${{ matrix.python }}, slow tier)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      # Action refs are SHA-pinned (audit P3-12); bump with
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Sync deps (web + async-translation extras)
        run: uv sync --extra web --extra async-translation

      - name: Cache HF Hub snapshot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/huggingface
          key: hf-surya-${{ matrix.python }}
          restore-keys: |
            hf-surya-

      - name: Run slow tests
        # `force_run: slow` overrides the default skip of slow markers
        # so the nightly run picks them up. Live-LLM is still skipped
        # since CI has no model server.
        run: uv run pytest -m slow --no-header -v

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-slow-results
          path: |
            .pytest_cache/v/cache/lastfailed
          if-no-files-found: ignore

  calibration:
    name: pytest (py${{ matrix.python }}, calibration regression)
    # Phase 3 of the OCR quality trust layer — runs the dataset-driven
    # Platt scaling regression + KIE-HVQA hallucination guard
    # agreement check on the fetched fixtures. The `slow_dataset`
    # mini-fixture smoke tests run with the fast suite; this job picks
    # up the full-fixture paths gated behind ``slow_dataset``.
    # Catches:
    #   * ECE drop regression on the held-out OCR-Quality split
    #     (acceptance: ≥ 20% drop vs. raw confidence).
    #   * KIE-HVQA per-region reliability agreement drop (acceptance:
    #     ≥ 80% agreement).
    # Datasets are fetched with `scripts/fetch_datasets.py` and cached
    # under ``tests/fixtures/datasets/`` across runs so the regression
    # doesn't re-download every night.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      # Action refs are SHA-pinned (audit P3-12); bump with
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Sync deps (web + async-translation extras)
        run: uv sync --extra web --extra async-translation

      - name: Cache HF Hub snapshot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/huggingface
          key: hf-surya-${{ matrix.python }}
          restore-keys: |
            hf-surya-

      - name: Cache regression datasets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            tests/fixtures/datasets/ocr_quality_full.json
            tests/fixtures/datasets/kie_hvqa_full.json
          key: regression-datasets-${{ matrix.python }}
          restore-keys: |
            regression-datasets-

      - name: Fetch regression datasets
        # Idempotent: skips when already cached. The script exits 77
        # (EX_NOPERM) while the license review gates the download —
        # treated as a clean skip here. Any *other* non-zero exit is a
        # genuine failure and must red-flag the job: the previous
        # `|| true` swallowed real breakage and silently turned the
        # regression gate into a no-op (audit P3-12).
        run: |
          set -euo pipefail
          for ds in ocr-quality kie-hvqa; do
            rc=0
            uv run python scripts/fetch_datasets.py --dataset "$ds" || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 77 ]; then
              echo "::error::fetch_datasets.py --dataset $ds exited $rc"
              exit "$rc"
            fi
          done

      - name: Run slow_dataset regression tests
        run: uv run pytest -m slow_dataset --no-header -v

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-slow-dataset-results
          path: |
            .pytest_cache/v/cache/lastfailed
          if-no-files-found: ignore
