# Pre-commit hooks for OmniScribe.
#
# Install once after cloning: `uv tool run pre-commit install`.
# The `uv lock` hook keeps ``uv.lock`` in sync with ``pyproject.toml``
# when dependency-affecting files change; the ruff hooks enforce the
# lint / format gates locally so CI doesn't surprise you; the mypy
# hook catches type errors before they reach review.
#
# Ruff is pinned to a recent stable version matching the ``>=0.16.2``
# dev requirement in ``pyproject.toml``. Bump both in lockstep.
#
# The mypy hook runs with ``language: system`` so it uses the project
# venv (``uv sync``) — the same interpreter and dependency set CI's
# ``uv run mypy src`` uses. The previous ``mirrors-mypy`` isolated env
# lacked the project's dependencies, so import resolution diverged
# from CI (audit backlog: "pre-commit mypy weaker than CI").

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (project venv)
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.7
    hooks:
      - id: uv-lock
        # Keep ``uv.lock`` and ``pyproject.toml`` consistent. Slow but
        # bounded - the install environment is intentionally empty
        # so the lock step doesn't try to fetch huge optional stacks.
        args: ["--frozen=false"]
