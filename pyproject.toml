[project]
name = "local-deepl"
version = "0.1.0"
description = "Transform scanned and written documents into fully searchable, selectable PDFs using the power of Local LLM Vision"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Ahnaf An Nafee", email = "ahnafnafee@gmail.com" },
]
keywords = ["ocr", "pdf", "vision", "llm", "olmocr", "surya"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=2.11.0",
    "pillow>=11.3",
    "pymupdf>=1.26.7",
    "python-dotenv>=1.2.1",
    "tqdm>=4.67.1",
    "surya-ocr>=0.17.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python-headless>=4.8.0",
    "litellm>=1.35.0",
    "httpx>=0.27.0",
    # surya 0.17.x imports `requests` in surya/common/s3.py but doesn't
    # declare it. Newer huggingface-hub (≥1.0) no longer pulls it in
    # transitively, so a clean `pip install local-llm-pdf-ocr` would crash on
    # the first Surya import. Listed here until surya fixes it upstream.
    "requests>=2.31",
    "pyspellchecker>=0.8.1",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.124.4",
    "uvicorn>=0.38.0",
    "websockets>=10.0,<14.0",
    "python-multipart>=0.0.20",
]
# Async translation: the LLM-driven translation workflow. ``chromadb`` and
# ``sentence-transformers`` are intentionally kept out so this extra is
# light (no torch / torch-multiprocessing). Install ``memory`` alongside
# for the lexicon-backed RAG feature; the translation module degrades
# gracefully when the lexicon store is unavailable.
async-translation = [
    "celery>=5.4.0",
    "redis>=5.0.0",
    "langgraph>=0.1.0",
]
memory = [
    "chromadb>=0.5.0",
    "sentence-transformers>=5.5.1",
]

# TrOCR specialist (handwriting OCR). Adds transformers + sentencepiece.
trocr = [
    "transformers>=4.45.0",
    "sentencepiece>=0.2.0",
    "safetensors>=0.4.0",
]

# NLLB-200 fast translation fallback. Reuses transformers + sentencepiece.
nllb = [
    "transformers>=4.45.0",
    "sentencepiece>=0.2.0",
]

# Translation quality scoring (chrF++, BLEU, etc.).
quality = [
    "sacrebleu>=2.4.0",
]

# COMET learned-metric scoring (opt-in, GPU-preferred, large download).
comet = [
    "unbabel-comet>=2.2.0",
]


[project.scripts]
local-deepl-server = "local_deepl.server:main"

[project.urls]
Homepage = "https://github.com/Sifr-r/LocalDeepL"
Repository = "https://github.com/Sifr-r/LocalDeepL"
Issues = "https://github.com/Sifr-r/LocalDeepL/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["src/local_deepl"]

[tool.hatch.build.targets.sdist]
include = [
    "src/local_deepl",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pyyaml>=6.0",
]

[tool.uv]
# surya-ocr 0.17.x pins pillow <11, but we want Pillow ≥11.3 for native
# AVIF decoding (drops the pillow-avif-plugin runtime dep entirely). The
# Pillow 10→11 changes surya might hit are deprecated-API removals and
# Python 3.8 drop; both already aligned with our requires-python >=3.11
# floor, so the override is safe in practice.
override-dependencies = [
    "pillow>=11.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: loads Surya models (~5s first run) — skip with '-m \"not slow\"'",
    "live_llm: hits a real LLM endpoint — skip unless LM Studio is running",
]
filterwarnings = [
    "ignore::pydantic.PydanticDeprecatedSince20:surya.*",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify (ternary, match, etc.)
    "RUF", # ruff-specific rules
    "G",   # flake8-logging-format (catches f-strings in logger.*)
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (standard in FastAPI)
    "G004", # f-strings in logging — too noisy in this codebase's existing style
]

[tool.ruff.lint.per-file-ignores]
# Pre-existing violations surfaced when SIM/RUF/G were enabled. Each entry
# defers the cleanup to a follow-up PR so the new rules stay active for new
# code without bundling unrelated fixes into this commit.
"src/local_deepl/api/routers/config.py" = ["RUF003"]
"src/local_deepl/api/routers/extraction.py" = ["SIM105"]
"src/local_deepl/api/routers/ocr.py" = ["RUF003"]
"src/local_deepl/api/services/security.py" = ["SIM115"]
"src/local_deepl/core/grounded.py" = ["SIM113"]
# RUF001 in core/ocr.py: the curly quotes in `_trim` are intentional —
# OCR can emit curly quotes that need stripping, not ASCII apostrophes.
"src/local_deepl/core/ocr.py" = ["RUF001"]
"src/local_deepl/core/processors.py" = ["RUF002", "RUF005"]
"src/local_deepl/evaluation.py" = ["RUF002"]
"tests/**/*.py" = [
    "RUF002", # × in docstring comments
    "RUF003", # × in inline comments
    "RUF005", # list concatenation in test fixture builders
    "RUF007", # pairwise() in helper loops
    "RUF012", # mutable class defaults in test stub classes
    "RUF015", # single-element slice patterns in fixture lookups
    "SIM117", # nested `with` statements in test setup
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `core/` is the production hot path — require explicit type annotations
# on every public function and method. Adds one extra line per function
# in exchange for runtime safety and a faster mypy loop.
module = "local_deepl.core.*"
disallow_untyped_defs = true
check_untyped_defs = true

