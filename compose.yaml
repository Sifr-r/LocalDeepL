# Local docker-compose stack for OmniScribe.
#
# Services:
#   * ``api``    - FastAPI web app (port 8000). Always-on.
#   * ``worker`` - Celery worker for async translation. Optional; only
#                  starts when ``--profile async`` is passed.
#   * ``redis``  - Broker + result backend for Celery. Always-on so
#                  ``api`` can publish jobs even if no worker is up.
#
# ``api`` and ``redis`` carry no ``profiles:`` key on purpose: Compose
# has no implicit default profile, so a ``profiles: ["default"]`` tag
# would exclude them from a plain ``docker compose up`` entirely.
#
# Usage:
#   docker compose up             # api + redis only
#   docker compose --profile async up --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: omniscribe:app
    # F5-07 audit fix: migrate from the legacy v1 ``mem_limit`` key
    # to the modern ``deploy.resources.limits`` block. Same 4 GB
    # ceiling, but the modern form is supported by both Compose
    # v2+ and Swarm-mode deploys. The ``deploy:`` block is a
    # no-op for plain ``docker compose up`` (only consulted when
    # the stack is deployed via ``docker stack deploy``), so the
    # memory cap is informational here — the runtime still respects
    # cgroup limits from any host-side orchestrator.
    deploy:
      resources:
        limits:
          memory: 4g
    # F5-05 audit fix: the API now binds to loopback on the host
    # by default (``127.0.0.1:8000:8000`` instead of ``8000:8000``).
    # The previous wildcard publish meant a plain ``docker compose
    # up`` on a LAN-facing host handed anyone reachable the OCR
    # API. Loopback is the safe default; operators who need LAN
    # exposure should change to ``"8000:8000"`` *after* setting
    # ``OMNISCRIBE_AUTH_TOKEN`` (the F2.1 hardening is the only
    # auth gate). The Redis service was already loopback-only and
    # is unchanged.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Hosts running the LM Studio / Ollama endpoint should override
      # ``LLM_API_BASE`` (and ``LLM_API_KEY`` if needed). The default
      # below targets the host network gateway that Docker Desktop
      # exposes the LM Studio server on.
      LLM_API_BASE: http://host.docker.internal:1234/v1
      # Broker/backend for the async-translation and redis state paths.
      # F5-06 audit fix: the previous ``omniscribe-local-dev`` default
      # password was a *known* string and was the same fallback at every
      # site that referenced ``REDIS_PASSWORD`` (4 places). Anyone who
      # could reach the Redis port (loopback-only in our setup, but a
      # default is still a default) had a credential. The new contract:
      #   * ``.env`` (gitignored) is the only place a real password lives.
      #   * When ``.env`` is absent, Compose refuses to start the stack
      #     (no silent fallback to a known string). The .env.example
      #     ships a generator one-liner so the operator can create a
      #     strong password in a single command.
      # The ``REDIS_URL`` and ``requirepass`` lines below read the same
      # var, so the env-var contract is symmetric — one password, four
      # uses, all sourced from ``.env`` or rejected at startup.
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env (see .env.example)}@redis:6379/0
      # Persistent artifact/state directory for SQLite and LanceDB.
      OMNISCRIBE_ARTIFACT_DIR: /app/data
      # Recommended security defaults. See README "Security" section.
      # 10240 MB (10 GB) matches ``SecuritySettings.DEFAULT_MAX_UPLOAD_MB``
      # in ``src/omniscribe/api/middleware/settings.py`` and the
      # ``.env.example`` shipped with the repo. The size cap is enforced
      # by ``MaxUploadSizeMiddleware``; raise this for LAN/public hosts
      # only after sizing disk + memory to honour it.
      OMNISCRIBE_MAX_UPLOAD_MB: "10240"
      OMNISCRIBE_RATE_LIMIT_PER_MIN: "60"
      # F5-16 audit fix: the previous example token ``change-me-in-prod``
      # is in the boot-time denylist (``api/middleware/settings.py: PLACEHOLDER_AUTH_TOKENS``)
      # and would *refuse* to start. The example now points operators
      # at an openssl-rand one-liner so copy-paste always lands on a
      # real, high-entropy secret. See .env.example for the same hint
      # in a more discoverable spot.
      # OMNISCRIBE_AUTH_TOKEN: <generate with: openssl rand -hex 32>
    volumes:
      - app-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    # Liveness probe: ``/health`` is the cheap, no-I/O endpoint
    # (see ``src/omniscribe/api/routers/health.py``) — it only confirms
    # that the FastAPI process is up. Uses Python urllib to avoid depending
    # on curl in the container. Interval/timeout/retries/start_period
    # follow the audit's recommended defaults.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - omniscribe

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: omniscribe:app
    # Same ``mem_limit`` → ``deploy.resources.limits`` migration as
    # the ``api`` service (F5-07). 4 GB is the same ceiling the
    # legacy v1 key applied.
    deploy:
      resources:
        limits:
          memory: 4g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["celery", "-A", "omniscribe.api.tasks", "worker", "--loglevel=info", "--pool=solo"]
    environment:
      LLM_API_BASE: http://host.docker.internal:1234/v1
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env (see .env.example)}@redis:6379/0
      OMNISCRIBE_ARTIFACT_DIR: /app/data
    volumes:
      - app-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A omniscribe.api.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - omniscribe
    profiles: ["async"]

  redis:
    # Sprint 5 / H-5 audit fix: pin to a verified OCI image-index digest
    # rather than the floating ``redis:7-alpine`` tag. ``redis:7-alpine``
    # is a multi-arch OCI image index — the digest below is the
    # multi-platform ``manifest list`` digest, not a per-arch
    # manifest. The same refresh procedure as the Dockerfile
    # python:3.14-slim pin applies: ``docker buildx imagetools inspect
    # redis:7-alpine`` returns the current digest; bump here and let
    # Compose's pull fail loud on a digest mismatch. Lookup performed
    # against registry-1.docker.io/v2/library/redis/manifests/7-alpine
    # with a public pull token.
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ``AOF every second`` is the standard production trade-off; for a
    # single-host personal stack, ``--save ""`` (no snapshots) is fine
    # and avoids disk pressure. Override with command: when needed.
    # ``--requirepass`` closes the unauthenticated-Redis hole (audit
    # P1-6); ``REDIS_PASSWORD`` MUST be set in .env (see .env.example)
    # — Compose's ``:?`` substitution aborts startup with a clear error
    # when it's missing, so a misconfigured stack can never silently
    # come up with the old ``omniscribe-local-dev`` known password.
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env (see .env.example)}"]
    # Loopback-only publish: api/worker reach redis over the compose
    # network, so the host port is only for local inspection tools.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # Same ``REDIS_PASSWORD:?`` substitution — the healthcheck
      # command must use the same var or the password mismatch will
      # silently make the probe always fail.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env (see .env.example)}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - omniscribe

volumes:
  redis-data:
    name: omniscribe-redis-data
  app-data:
    name: omniscribe-app-data

# Sprint 5 / M-3 audit fix: declare an explicit bridge network so
# the stack is portable to Swarm / K8s / Nomad without rewriting
# ``networks:`` clauses. Compose v2 would create a default ``<project>_default``
# network automatically; declaring it explicitly here also documents
# the intent for the operator.
networks:
  omniscribe:
    driver: bridge
    name: omniscribe

