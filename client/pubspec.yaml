name: omniscribe_client
description: "OmniScribe Flutter Client - High Performance PDF OCR & Document Processing"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.0
  file_picker: ^8.0.0
  desktop_drop: ^0.5.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  path: ^1.9.0
  url_launcher: ^6.2.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
